name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs for the same ref (helps when you push multiple times to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Spotless check
        run: mvn -B -ntp spotless:check

      - name: Unit tests
        run: mvn -B -ntp test

  docker-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install grpcurl
        run: |
          version=1.9.3
          curl --fail --location --silent --show-error \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${version}/grpcurl_${version}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Validate Compose model
        env:
          KVDB_INTERNAL_GRPC_TOKEN: ci-internal-token
          KVDB_ADMIN_SECURITY_API_KEY: ci-admin-key
        run: docker compose config --quiet

      - name: Build images and exercise failover
        run: ./scripts/docker_failover_test.sh
