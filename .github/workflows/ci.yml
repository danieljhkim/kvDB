name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-go@v6
        with:
          go-version-file: golang/kvcli/go.mod
          cache: false

      - name: Check Java formatting
        run: mvn -B -ntp spotless:check

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l golang/kvcli)"
          if [[ -n "$unformatted" ]]; then
            echo "Go files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  java-verification:
    name: Java invariants and coverage
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit, deterministic distributed-system, and persistence fault-injection tests
        run: mvn -B -ntp verify

      - name: Upload Java test and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-verification-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            coverage/target/site/jacoco-aggregate/**
          if-no-files-found: warn
          retention-days: 14

  go-verification:
    name: Go CLI race and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang/kvcli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: golang/kvcli/go.mod
          cache-dependency-path: golang/kvcli/go.sum

      - name: Run race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v6
        with:
          name: go-cli-coverage
          path: golang/kvcli/coverage.out
          retention-days: 14

  protobuf-compatibility:
    name: Protobuf compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - name: Lint protobuf contracts
        run: buf lint kv.proto/src/main/proto

      - name: Reject breaking protobuf changes
        if: github.event_name == 'pull_request'
        run: >-
          buf breaking kv.proto/src/main/proto
          --against ".git#branch=origin/${{ github.base_ref }},subdir=kv.proto/src/main/proto"

  docker-failover:
    name: Container failover and recovery
    needs: [java-verification, go-verification, protobuf-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install grpcurl
        run: |
          version=1.9.3
          curl --fail --location --silent --show-error \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${version}/grpcurl_${version}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Validate Compose model
        env:
          KVDB_ADMIN_SECURITY_API_KEY: ci-admin-key
          KVDB_ENV: test
          KVDB_GRPC_SECURITY_MODE: development-plaintext
          KVDB_TLS_DIR: .
        run: docker compose config --quiet

      - name: Build images and exercise failover, persistence, and volume wipe
        run: ./scripts/docker_failover_test.sh
