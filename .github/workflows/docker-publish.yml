name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - kv.node
          - kv.coordinator
          - kv.admin
          - kv.gateway

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: meta
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.TAG }}"

          # Always publish an immutable, versioned tag.
          VERSIONED="ghcr.io/${{ github.repository }}/${{ matrix.service }}:${TAG}"

          # Only publish :latest for non-RC tags.
          # (Treat tags containing "-rc" / "-RC" as release candidates.)
          if echo "$TAG" | grep -Eiq '(^|[-.])rc([0-9].*)?$|[-.]rc'; then
            echo "TAGS=${VERSIONED}" >> "$GITHUB_OUTPUT"
          else
            LATEST="ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest"
            echo "TAGS<<EOF" >> "$GITHUB_OUTPUT"
            echo "${VERSIONED}" >> "$GITHUB_OUTPUT"
            echo "${LATEST}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Docker base images are pinned
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' dockerfile; do
            if ! awk '
              toupper($1) == "FROM" {
                image_field = 2
                while (image_field <= NF && $image_field ~ /^--/) {
                  image_field++
                }
                if ($image_field !~ /@sha256:[[:xdigit:]]{64}$/) {
                  print FILENAME ":" FNR ": mutable or missing Docker base-image digest: " $0
                  invalid = 1
                }
              }
              END { exit invalid }
            ' "$dockerfile"; then
              status=1
            fi
          done < <(git ls-files -z -- '*Dockerfile*')
          exit "$status"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
