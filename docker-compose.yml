# Durable local cluster: three Raft coordinators, two storage nodes, gateway,
# and admin API. TLS material is mounted read-only from KVDB_TLS_DIR.

x-coordinator-common: &coordinator-common
  build:
    context: .
    dockerfile: kv.coordinator/Dockerfile
  networks:
    - kvdb-net
  environment: &coordinator-environment
    KVDB_ENV: ${KVDB_ENV:-docker}
    APP_CONFIG_PATH: app-config-docker.yml
    KVDB_GRPC_SECURITY_MODE: ${KVDB_GRPC_SECURITY_MODE:-mtls}
    KVDB_IDENTITY_ROLE: coordinator
    KVDB_INTERNAL_TLS_TRUST_BUNDLE: /run/secrets/kvdb/internal-ca-bundle.pem
    KVDB_INTERNAL_TLS_REVOCATION_LIST: /run/secrets/kvdb/internal-revoked.sha256
    KVDB_HEALTH_PORT: "19000"
  healthcheck: &coordinator-healthcheck
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/19000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
    interval: 5s
    timeout: 3s
    retries: 18
    start_period: 10s

services:
  coordinator1:
    <<: *coordinator-common
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      <<: *coordinator-environment
      COORDINATOR_NODE_ID: coordinator-1
      KVDB_IDENTITY_PRINCIPAL: coordinator-1
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/coordinator-1/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/coordinator-1/tls.key
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
      - coordinator1-data:/app/data

  coordinator2:
    <<: *coordinator-common
    ports:
      - "127.0.0.1:9002:9000"
    environment:
      <<: *coordinator-environment
      COORDINATOR_NODE_ID: coordinator-2
      KVDB_IDENTITY_PRINCIPAL: coordinator-2
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/coordinator-2/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/coordinator-2/tls.key
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
      - coordinator2-data:/app/data

  coordinator3:
    <<: *coordinator-common
    ports:
      - "127.0.0.1:9003:9000"
    environment:
      <<: *coordinator-environment
      COORDINATOR_NODE_ID: coordinator-3
      KVDB_IDENTITY_PRINCIPAL: coordinator-3
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/coordinator-3/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/coordinator-3/tls.key
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
      - coordinator3-data:/app/data

  # Compose cannot express "any two of three dependencies are healthy". This
  # one-shot gate implements that quorum condition without making application
  # services depend on every coordinator remaining available.
  coordinator-quorum:
    <<: *coordinator-common
    depends_on:
      coordinator1:
        condition: service_started
      coordinator2:
        condition: service_started
      coordinator3:
        condition: service_started
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        deadline=$$((SECONDS + 120))
        while (( SECONDS < deadline )); do
          ready=0
          for host in coordinator1 coordinator2 coordinator3; do
            if exec 3<>/dev/tcp/$$host/19000 2>/dev/null; then
              printf 'GET /health/ready HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' "$$host" >&3
              if read -r -t 2 status <&3 && [[ "$$status" == *" 200 "* ]]; then
                ready=$$((ready + 1))
              fi
              exec 3<&- 3>&-
            fi
          done
          if (( ready >= 2 )); then
            echo "Coordinator quorum is ready ($$ready/3)"
            exit 0
          fi
          sleep 1
        done
        echo "Coordinator quorum did not become ready" >&2
        exit 1
    healthcheck:
      disable: true
    restart: "no"

  admin:
    build:
      context: .
      dockerfile: kv.admin/Dockerfile
    ports:
      - "127.0.0.1:8089:8089"
    networks:
      - kvdb-net
    depends_on:
      coordinator-quorum:
        condition: service_completed_successfully
    environment:
      KVDB_ENV: ${KVDB_ENV:-docker}
      KVDB_COORDINATOR_GRPC_ADDRESS: coordinator1:9000,coordinator2:9000,coordinator3:9000
      KVDB_ADMIN_SECURITY_ALLOWED_IPS: 127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      KVDB_ADMIN_SECURITY_API_KEY: ${KVDB_ADMIN_SECURITY_API_KEY:?Set KVDB_ADMIN_SECURITY_API_KEY}
      KVDB_GRPC_SECURITY_MODE: ${KVDB_GRPC_SECURITY_MODE:-mtls}
      KVDB_IDENTITY_ROLE: admin
      KVDB_IDENTITY_PRINCIPAL: admin-1
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/admin/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/admin/tls.key
      KVDB_INTERNAL_TLS_TRUST_BUNDLE: /run/secrets/kvdb/internal-ca-bundle.pem
      KVDB_INTERNAL_TLS_REVOCATION_LIST: /run/secrets/kvdb/internal-revoked.sha256
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8089; printf \"GET /admin/actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  node1:
    build:
      context: .
      dockerfile: kv.node/Dockerfile
    networks:
      - kvdb-net
    depends_on:
      coordinator-quorum:
        condition: service_completed_successfully
    environment:
      KVDB_ENV: ${KVDB_ENV:-docker}
      APP_CONFIG_PATH: app-config-docker.yml
      STORAGE_NODE_ID: node-1
      KVDB_GRPC_SECURITY_MODE: ${KVDB_GRPC_SECURITY_MODE:-mtls}
      KVDB_IDENTITY_ROLE: storage-node
      KVDB_IDENTITY_PRINCIPAL: node-1
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/node-1/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/node-1/tls.key
      KVDB_INTERNAL_TLS_TRUST_BUNDLE: /run/secrets/kvdb/internal-ca-bundle.pem
      KVDB_INTERNAL_TLS_REVOCATION_LIST: /run/secrets/kvdb/internal-revoked.sha256
      KVDB_HEALTH_PORT: "18001"
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
      - node1-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/18001; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  node2:
    build:
      context: .
      dockerfile: kv.node/Dockerfile
    networks:
      - kvdb-net
    depends_on:
      coordinator-quorum:
        condition: service_completed_successfully
    environment:
      KVDB_ENV: ${KVDB_ENV:-docker}
      APP_CONFIG_PATH: app-config-docker.yml
      STORAGE_NODE_ID: node-2
      KVDB_GRPC_SECURITY_MODE: ${KVDB_GRPC_SECURITY_MODE:-mtls}
      KVDB_IDENTITY_ROLE: storage-node
      KVDB_IDENTITY_PRINCIPAL: node-2
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/node-2/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/node-2/tls.key
      KVDB_INTERNAL_TLS_TRUST_BUNDLE: /run/secrets/kvdb/internal-ca-bundle.pem
      KVDB_INTERNAL_TLS_REVOCATION_LIST: /run/secrets/kvdb/internal-revoked.sha256
      KVDB_HEALTH_PORT: "18002"
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
      - node2-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/18002; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: kv.gateway/Dockerfile
    ports:
      - "127.0.0.1:7000:7000"
    networks:
      - kvdb-net
    depends_on:
      coordinator-quorum:
        condition: service_completed_successfully
      node1:
        condition: service_started
      node2:
        condition: service_started
    environment:
      KVDB_ENV: ${KVDB_ENV:-docker}
      APP_CONFIG_PATH: app-config-docker.yml
      KVDB_GRPC_SECURITY_MODE: ${KVDB_GRPC_SECURITY_MODE:-mtls}
      KVDB_IDENTITY_ROLE: gateway
      KVDB_IDENTITY_PRINCIPAL: gateway-1
      KVDB_INTERNAL_TLS_CERT_CHAIN: /run/secrets/kvdb/gateway-internal/tls.crt
      KVDB_INTERNAL_TLS_PRIVATE_KEY: /run/secrets/kvdb/gateway-internal/tls.key
      KVDB_INTERNAL_TLS_TRUST_BUNDLE: /run/secrets/kvdb/internal-ca-bundle.pem
      KVDB_INTERNAL_TLS_REVOCATION_LIST: /run/secrets/kvdb/internal-revoked.sha256
      KVDB_GATEWAY_TLS_CERT_CHAIN: /run/secrets/kvdb/gateway-server/tls.crt
      KVDB_GATEWAY_TLS_PRIVATE_KEY: /run/secrets/kvdb/gateway-server/tls.key
      KVDB_GATEWAY_TLS_TRUST_BUNDLE: /run/secrets/kvdb/gateway-client-ca-bundle.pem
      KVDB_GATEWAY_TLS_REVOCATION_LIST: /run/secrets/kvdb/gateway-revoked.sha256
      KVDB_HEALTH_PORT: "17000"
    volumes:
      - ${KVDB_TLS_DIR:?Set KVDB_TLS_DIR}:/run/secrets/kvdb:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/17000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

networks:
  kvdb-net:
    driver: bridge

volumes:
  coordinator1-data:
  coordinator2-data:
  coordinator3-data:
  node1-data:
  node2-data:
