# docker-compose up --build
# docker-compose down

services:

  coordinator:
    build:
      context: .
      dockerfile: kv.coordinator/Dockerfile
    container_name: kvdb-coordinator
    # Coordinator gRPC stays on kvdb-net only. Do not publish 9000 to the host.
    networks:
      - kvdb-net
    environment:
      - KVDB_ENV=docker
      - APP_CONFIG_PATH=app-config-docker.yml
      - COORDINATOR_NODE_ID=coordinator-1
      - KVDB_INTERNAL_GRPC_TOKEN=${KVDB_INTERNAL_GRPC_TOKEN:?Set KVDB_INTERNAL_GRPC_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: .
      dockerfile: kv.admin/Dockerfile
    container_name: kvdb-admin
    ports:
      # Keep the control plane private to the Docker host. Put a separately
      # authenticated reverse proxy in front of it before exposing it remotely.
      - "127.0.0.1:8089:8089"
    networks:
      - kvdb-net
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - KVDB_ENV=docker
      - KVDB_COORDINATOR_GRPC_ADDRESS=coordinator:9000
      # The admin API always enforces both the API key and the IP allowlist.
      - KVDB_ADMIN_SECURITY_ALLOWED_IPS=127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      - KVDB_ADMIN_SECURITY_API_KEY=${KVDB_ADMIN_SECURITY_API_KEY:?Set KVDB_ADMIN_SECURITY_API_KEY}
      - KVDB_INTERNAL_GRPC_TOKEN=${KVDB_INTERNAL_GRPC_TOKEN:?Set KVDB_INTERNAL_GRPC_TOKEN}

  node1:
    build:
      context: .
      dockerfile: kv.node/Dockerfile
    container_name: kvdb-node1
    # Storage-node gRPC stays on kvdb-net only. Do not publish 8001 to the host.
    networks:
      - kvdb-net
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - KVDB_ENV=docker
      - APP_CONFIG_PATH=app-config-docker.yml
      - STORAGE_NODE_ID=node-1
      - KVDB_INTERNAL_GRPC_TOKEN=${KVDB_INTERNAL_GRPC_TOKEN:?Set KVDB_INTERNAL_GRPC_TOKEN}
    volumes:
      - node1-data:/app/data

  node2:
    build:
      context: .
      dockerfile: kv.node/Dockerfile
    container_name: kvdb-node2
    # Storage-node gRPC stays on kvdb-net only. Do not publish 8002 to the host.
    networks:
      - kvdb-net
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - KVDB_ENV=docker
      - APP_CONFIG_PATH=app-config-docker.yml
      - STORAGE_NODE_ID=node-2
      - KVDB_INTERNAL_GRPC_TOKEN=${KVDB_INTERNAL_GRPC_TOKEN:?Set KVDB_INTERNAL_GRPC_TOKEN}
    volumes:
      - node2-data:/app/data

  gateway:
    build:
      context: .
      dockerfile: kv.gateway/Dockerfile
    container_name: kvdb-gateway
    ports:
      - "7000:7000"
    networks:
      - kvdb-net
    depends_on:
      coordinator:
        condition: service_healthy
      node1:
        condition: service_started
      node2:
        condition: service_started
    environment:
      - KVDB_ENV=docker
      - APP_CONFIG_PATH=app-config-docker.yml
      - KVDB_INTERNAL_GRPC_TOKEN=${KVDB_INTERNAL_GRPC_TOKEN:?Set KVDB_INTERNAL_GRPC_TOKEN}

networks:
  kvdb-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
