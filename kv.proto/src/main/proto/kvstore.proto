syntax = "proto3";

package kvdb.kvstore;

option java_package = "com.kvdb.proto.kvstore";
option java_multiple_files = true;


service KVService {
  rpc Get (KeyRequest) returns (ValueResponse);
  rpc Set (KeyValueRequest) returns (SetResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  // Internal replication RPCs (node-to-node). These should not be called by clients.
  rpc ReplicateMutation (ReplicateMutationRequest) returns (ReplicationAck);
  rpc RepairReplica (ReplicaRepairRequest) returns (ReplicaRepairResponse);
  rpc FetchReplicaState (ReplicaStateRequest) returns (ReplicaStateResponse);
  rpc Ping (PingRequest) returns (PingResponse);
  rpc Shutdown (ShutdownRequest) returns (ShutdownResponse);
}

message KeyRequest {
  // bytes and string are both length-delimited on the wire. The binary form
  // preserves compatibility with already-deployed UTF-8-only senders while
  // allowing new callers to use arbitrary keys.
  bytes key = 1;
  // Strong reads set this so the node must prove current leadership and
  // reconcile with a replica quorum before returning a value.
  bool require_leader = 2;
  bool head_only = 3;
}

message KeyValueRequest {
  bytes key = 1;
  bytes value = 2;
  // Stable across gateway retries. The node generates one only for legacy callers.
  string request_id = 3;
  WriteDurability durability = 4;
  uint64 ttl_ms = 5;
  optional uint64 if_version_equals = 6;
  bool if_not_exists = 7;
}

message ValueResponse {
  bytes value = 1;
  // Version of this key's last committed mutation, or 0 for legacy data.
  uint64 version = 2;
  // Shard-wide committed high-water mark applied by the serving node.
  uint64 applied_version = 3;
  uint64 shard_epoch = 4;
  // Distinguishes an absent key from a present empty value.
  bool found = 5;
  uint64 create_time_ms = 6;
  uint64 update_time_ms = 7;
  uint64 expire_time_ms = 8;
}

message SetResponse {
  bool success = 1;
  string request_id = 2;
  uint64 version = 3;
  bool durable = 4;
  MutationOutcome outcome = 5;
  string message = 6;
}

message DeleteRequest {
  bytes key = 1;
  string request_id = 2;
  WriteDurability durability = 3;
  optional uint64 if_version_equals = 4;
  // Included so both node boundaries can explicitly reject nonsensical
  // delete options instead of silently ignoring them.
  bool if_not_exists = 5;
  uint64 ttl_ms = 6;
}

message DeleteResponse {
  bool success = 1;
  string request_id = 2;
  uint64 version = 3;
  bool durable = 4;
  MutationOutcome outcome = 5;
  string message = 6;
}

// ============================
// Replication (internal)
// ============================

enum WriteDurability {
  WRITE_DURABILITY_UNSPECIFIED = 0;
  QUORUM_SYNC = 1;
  ALL_SYNC = 2;
  LOCAL_SYNC = 3;
}

enum MutationOutcome {
  MUTATION_OUTCOME_UNSPECIFIED = 0;
  APPLIED = 1;
  ALREADY_EXISTS = 2;
  VERSION_MISMATCH = 3;
  INVALID_OPTIONS = 4;
}

enum MutationKind {
  MUTATION_KIND_UNSPECIFIED = 0;
  SET = 1;
  DELETE = 2;
}

enum ReplicationPhase {
  REPLICATION_PHASE_UNSPECIFIED = 0;
  PREPARE = 1;
  COMMIT = 2;
  ABORT = 3;
}

message ReplicatedMutation {
  string request_id = 1;
  string shard_id = 2;
  uint64 epoch = 3;
  uint64 version = 4;
  MutationKind kind = 5;
  bytes key = 6;
  bytes value = 7;
  string origin_node_id = 8;
  uint64 ttl_ms = 9;
  optional uint64 if_version_equals = 10;
  bool if_not_exists = 11;
  uint64 create_time_ms = 12;
  uint64 update_time_ms = 13;
  uint64 expire_time_ms = 14;
}

message ReplicateMutationRequest {
  ReplicatedMutation mutation = 1;
  ReplicationPhase phase = 2;
}

message ReplicationAck {
  bool success = 1;
  bool durable = 2;
  uint64 epoch = 3;
  uint64 committed_version = 4;
  string message = 5;
}

message ReplicaRepairRequest {
  string shard_id = 1;
  uint64 epoch = 2;
  repeated ReplicatedMutation committed_mutations = 3;
}

message ReplicaRepairResponse {
  bool success = 1;
  bool durable = 2;
  uint32 applied_mutations = 3;
  uint64 committed_version = 4;
}

message ReplicaStateRequest {
  string shard_id = 1;
  uint64 epoch = 2;
  uint64 after_version = 3;
  uint32 max_mutations = 4;
}

message ReplicaStateResponse {
  bool success = 1;
  bool durable = 2;
  repeated ReplicatedMutation committed_mutations = 3;
  bool has_more = 4;
  uint64 committed_version = 5;
}

message PingRequest {
}

message PingResponse {
  string message = 1;
}

message ShutdownRequest {
}

message ShutdownResponse {
  string message = 1;
}
