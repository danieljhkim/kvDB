syntax = "proto3";

package kvdb.replication;

option java_package = "com.kvdb.proto.replication";
option java_multiple_files = true;


// Replication RPC: leader -> follower
service ReplicationService {
  rpc Replicate (ReplicationRequest) returns (ReplicationResponse);
}

message ReplicationRequest {
  string request_id = 1; // stable across retries
  string shard_id = 2;
  uint64 shard_epoch = 3;
  uint64 version = 4;    // monotonic shard log position
  string operation = 5; // "PUT" or "DELETE"
  string key = 6;
  string value = 7;     // for put
  ReplicationPhase phase = 8;
}

message ReplicationResponse {
  bool success = 1;
  bool durable = 2;
  uint64 committed_version = 3;
}

enum ReplicationPhase {
  REPLICATION_PHASE_UNSPECIFIED = 0;
  PREPARE = 1;
  COMMIT = 2;
  ABORT = 3;
}
